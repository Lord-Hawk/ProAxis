<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProMandi">
<title>ProMandi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <video id="splashVid" playsinline webkit-playsinline preload="auto"><source src="splash.mp4?v=5" type="video/mp4"><source id="splashLast" src="splash.webm?v=5" type="video/webm"></video>
  <button id="splashSound" type="button" hidden>🔊 Tap for sound</button>
</div>
<script>
/* start-up animation: full white screen, the logo video WITH sound (if the phone allows it), then the app */
(function () {
  var sp = document.getElementById('splash'), v = document.getElementById('splashVid'), snd = document.getElementById('splashSound'), done = false;
  function finish() { if (done) return; done = true; sp.classList.add('hide'); setTimeout(function () { sp.remove(); }, 450); }
  try { if (sessionStorage.getItem('pa_splash')) { sp.remove(); return; } sessionStorage.setItem('pa_splash', '1'); } catch (e) {}
  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  document.getElementById('splashLast').addEventListener('error', finish);   // no format this browser can play
  setTimeout(finish, 8000);                                   // never longer than 8 s
  sp.addEventListener('click', function (e) {
    if (e.target === snd || v.muted) { v.muted = false; snd.hidden = true; v.play().catch(function () {}); }
  });
  v.muted = false;
  var p = v.play();
  if (p && p.catch) p.catch(function () {                       // the browser blocked sound: play silently, offer sound
    v.muted = true; snd.hidden = false;
    v.play().catch(finish);
  });
})();
</script>
<div id="app"><p class="boot">Loading ProMandi…</p></div>
<script>
/* shows any error on screen (a file that did not load, or a bug) instead of a blank page */
(function () {
  function show(msg) {
    var b = document.getElementById('pa-err');
    if (!b) { b = document.createElement('div'); b.id = 'pa-err';
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#b91c1c;color:#fff;padding:10px 12px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;white-space:pre-wrap;word-break:break-word';
      document.body.appendChild(b); }
    b.textContent = (b.textContent ? b.textContent + '\n' : 'Something went wrong – please send this message:\n') + msg;
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'VIDEO' || t.tagName === 'SOURCE')) return;   // a start-up video format this phone can't play: not an error                    // the start-up video failing just skips the animation
    if (t && t !== window && (t.src || t.href)) show('Could not load ' + (t.src || t.href));
    else show((e.message || 'Error') + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
  window.__paShow = show;
})();
</script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
