<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ProMandi">
<title>ProMandi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <video id="splashVid" playsinline webkit-playsinline preload="auto"><source src="splash.mp4?v=6" type="video/mp4"><source id="splashLast" src="splash.webm?v=6" type="video/webm"></video>
</div>
<script>
/* start-up animation: full white screen, the logo video WITH sound, then the app.
   If the browser refuses sound before the user has touched the page, the video keeps playing
   and the sound switches on at the first touch, click or key press – no button is shown. */
(function () {
  var sp = document.getElementById('splash'), v = document.getElementById('splashVid'), done = false;
  function finish() { if (done) return; done = true; sp.classList.add('hide'); unbind(); setTimeout(function () { sp.remove(); }, 450); }
  try { if (sessionStorage.getItem('pa_splash')) { sp.remove(); return; } sessionStorage.setItem('pa_splash', '1'); } catch (e) {}
  var evs = ['pointerdown', 'touchstart', 'keydown', 'click'];
  function unmute() { if (done) return; v.muted = false; v.volume = 1; v.play().catch(function () {}); unbind(); }
  function unbind() { evs.forEach(function (n) { document.removeEventListener(n, unmute, true); }); }
  v.addEventListener('ended', finish);
  v.addEventListener('error', finish);
  document.getElementById('splashLast').addEventListener('error', finish);   // no format this browser can play
  setTimeout(finish, 8000);                                   // never longer than 8 s
  v.muted = false; v.volume = 1;
  var p = v.play();
  if (p && p.catch) p.catch(function () {                       // sound blocked: play silently, unmute on the first touch
    v.muted = true;
    v.play().catch(finish);
    evs.forEach(function (n) { document.addEventListener(n, unmute, true); });
  });
})();
</script>
<div id="app"><p class="boot">Loading ProMandi…</p></div>
<script>
/* shows any error on screen (a file that did not load, or a bug) instead of a blank page */
(function () {
  function show(msg) {
    var b = document.getElementById('pa-err');
    if (!b) { b = document.createElement('div'); b.id = 'pa-err';
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#b91c1c;color:#fff;padding:10px 12px;border-radius:10px;font:14px/1.4 system-ui,sans-serif;white-space:pre-wrap;word-break:break-word';
      document.body.appendChild(b); }
    b.textContent = (b.textContent ? b.textContent + '\n' : 'Something went wrong – please send this message:\n') + msg;
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'VIDEO' || t.tagName === 'SOURCE')) return;   // a start-up video format this phone can't play: not an error                    // the start-up video failing just skips the animation
    if (t && t !== window && (t.src || t.href)) show('Could not load ' + (t.src || t.href));
    else show((e.message || 'Error') + (e.filename ? '  (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
  window.__paShow = show;
})();
</script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
